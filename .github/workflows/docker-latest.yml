name: Docker latest

# When you press "Publish release" on a draft, this points ghcr.io/zedhand/superduperraidbot:latest at that
# version's image (already built and pushed by the Release workflow). Nothing is rebuilt; only the tag moves.
# Pre-releases are skipped, so :latest is always the newest published release.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-latest
  cancel-in-progress: false

jobs:
  latest:
    name: Point :latest at the published release
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
      - name: Tag the release's image as latest
        env:
          TAG: ${{ github.event.release.tag_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          version=${TAG#v}
          docker buildx imagetools create --tag "$image:latest" "$image:$version"
          echo "$image:latest now points at $version" >> "$GITHUB_STEP_SUMMARY"
