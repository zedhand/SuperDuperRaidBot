name: Release

# Push a version tag (git tag v1.13.0 && git push origin v1.13.0) and this:
#   1. runs every test suite and the lint/security checks,
#   2. checks the tag matches VERSION in bot.py and that CHANGELOG.md has a section for it,
#   3. builds SuperDuperRaidBot-v<version>.zip exactly like the hand-made releases and scans it for secrets,
#   4. creates a DRAFT release with the zip attached and the CHANGELOG section as the notes,
#   5. builds the Docker image for PCs (amd64) and the Raspberry Pi (arm64) and pushes it to
#      ghcr.io/zedhand/superduperraidbot:<version> (for example :1.13.2). It never replaces an existing version.
# Nothing is public until you open the draft on GitHub, check the notes and press "Publish release".
# Update.bat and docker-update.sh only see published releases, so a draft never reaches anyone, and the image's
# :latest and :major.minor tags only move when the release is published (docker-latest.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  release:
    name: Build, scan and draft the release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the draft release and upload the zip
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build and scan the zip
        id: build
        env:
          TAG: ${{ github.ref_name }}
          # Optional: the contents of the local .git/leak-blocklist.sha256 (hashes only), saved as a repository
          # secret. When it is set, the zip is also checked for those names. Empty or missing just skips that check.
          LEAK_BLOCKLIST: ${{ secrets.LEAK_BLOCKLIST }}
        run: >
          python .github/scripts/build_release.py
          --tag "$TAG"
          --notes "$RUNNER_TEMP/notes.md"
          --github-output "$GITHUB_OUTPUT"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.build.outputs.zip }}
          SHA: ${{ steps.build.outputs.sha256 }}
        run: |
          printf '\n---\nsha256 of the zip: `%s`\n' "$SHA" >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$ZIP" \
            --draft \
            --verify-tag \
            --title "SuperDuperRaidBot $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "Draft release created for $TAG. Review and publish it on the Releases page." >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build and push the Docker image (PC and Raspberry Pi)
    needs: release    # only after the tests passed and the release zip scanned clean
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io (the repository's own package)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0 (lets the PC runner build the Raspberry Pi arm64 image too)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Work out the image tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')   # image names must be lower case
          # Only the exact version is pushed here. The moving :1.13 and :latest tags follow when the release is
          # published (docker-latest.yml), so a draft that is deleted never moves them.
          {
            echo "image=$image"
            echo "tags=$image:$VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
      - name: Never replace an image that was already published
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists. People may have pulled it, so it isn't replaced. Release a new version number instead."
            exit 1
          fi
      - name: Build and push for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Fixed labels only: no build machine, user or path details go into the image.
          labels: |
            org.opencontainers.image.title=SuperDuperRaidBot
            org.opencontainers.image.description=Discord raid signup bot for World of Warcraft
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          provenance: false
          sbom: false
      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          echo "Docker image pushed: $TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo ":latest and the :major.minor tag move to it when you publish the release." >> "$GITHUB_STEP_SUMMARY"
