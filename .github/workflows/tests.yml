name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # the release workflow runs these same checks before it builds

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run every test suite (offline, no Discord token needed)
        run: python tests/run_all.py

  audit:
    name: Lint and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install -r requirements.txt ruff bandit pip-audit
      - name: Real errors only (unused names, undefined names, syntax)
        run: ruff check --isolated --select F,E9 .
      - name: Security scan (medium severity and above)
        run: bandit -q -ll -r bot.py db.py checks.py embeds.py wow_data.py setup.py
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt

  docker:
    name: Docker image (PC and Raspberry Pi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4      # lets the PC runner build the Raspberry Pi (arm64) image too
      - uses: docker/setup-buildx-action@v4
      - name: Build for amd64 and arm64 (not pushed anywhere)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Starts and explains a missing token instead of crashing
        run: |
          docker build -t raidbot:ci .
          out=$(docker run --rm raidbot:ci 2>&1) && exit 1 || true
          echo "$out"
          echo "$out" | grep -q "DISCORD_TOKEN isn't set"
