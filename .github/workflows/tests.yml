name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run every test suite (offline, no Discord token needed)
        run: python tests/run_all.py

  audit:
    name: Lint and security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install -r requirements.txt ruff bandit pip-audit
      - name: Real errors only (unused names, undefined names, syntax)
        run: ruff check --isolated --select F,E9 .
      - name: Security scan (medium severity and above)
        run: bandit -q -ll -r bot.py db.py checks.py embeds.py wow_data.py setup.py
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt
