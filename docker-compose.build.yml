# Build the image from the source in this folder instead of downloading the ready-made one.
# Use it together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# or simply:  ./docker-update.sh --build
# The result gets the same name as the ready-made image, so the everyday commands in DOCKER.md keep working.
services:
  raidbot:
    build: .
